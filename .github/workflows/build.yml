name: Build APK

on:
  push:
    branches:
      - work/horizon-rust-integration
  workflow_dispatch:
    inputs:
      variant:
        description: APK build variant
        required: true
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  workflow_call:
    inputs:
      variant:
        required: true
        type: string
    secrets:
      KEY_PASSWORD:
        required: false
      STORE_PASSWORD:
        required: false
      OAUTH_CLIENT_ID:
        required: false
      CURSEFORGE_API_KEY:
        required: false

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["all", "arm", "arm64", "x86", "x86_64"]
      fail-fast: false

    env:
      BUILD_VARIANT: ${{ inputs.variant || 'Debug' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout Vyron
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout Horizon Android port
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        uses: actions/checkout@v6
        with:
          repository: ray3nndev/horizon-android
          ref: a547d74384b2f590fc15034e909272e02bcd230d
          path: horizon-android
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            PetLib/rust/target
            horizon-android/bridge/target
          key: petlib-horizon-rust-${{ runner.os }}-${{ hashFiles('PetLib/rust/Cargo.lock', 'horizon-android/bridge/Cargo.lock', 'horizon-android/engine/horizon-upstream/Cargo.lock') }}
          restore-keys: petlib-horizon-rust-${{ runner.os }}-

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*
          cargo ndk --version

      - name: Setup Android NDK for launcher
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "Using launcher NDK at $ndk"
          test -f "$ndk/source.properties"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Install pinned Horizon NDK
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configure Horizon Android linker
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "HORIZON_ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"

      - name: Apply Horizon Android port patches
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        run: bash horizon-android/scripts/apply-engine-patches.sh

      - name: Build Horizon Android ARM64 bridge
        if: matrix.arch == 'all' || matrix.arch == 'arm64'
        run: |
          cargo build --release --manifest-path horizon-android/bridge/Cargo.toml --target aarch64-linux-android
          LIBRARY="horizon-android/bridge/target/aarch64-linux-android/release/libhorizon_android_bridge.so"
          test -s "$LIBRARY"
          llvm-nm -D "$LIBRARY" | grep -F "Java_com_ray3nndev_vyron_nativebridge_HorizonBridge_nativeConfigure"
          llvm-nm -D "$LIBRARY" | grep -F "Java_com_ray3nndev_vyron_nativebridge_HorizonBridge_nativePrepare"
          mkdir -p ZalithLauncher/src/main/jniLibs/arm64-v8a
          install -m 0644 "$LIBRARY" ZalithLauncher/src/main/jniLibs/arm64-v8a/libhorizon_android_bridge.so
          file ZalithLauncher/src/main/jniLibs/arm64-v8a/libhorizon_android_bridge.so

      - name: Build APK for ${{ matrix.arch }}
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assemble${{ env.BUILD_VARIANT }} -Darch=${{ matrix.arch }}

      - name: Upload Release APK for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/release/*.apk

      - name: Upload Release Mapping for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Release'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: mapping (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/mapping/release/mapping.txt

      - name: Upload Debug APK for ${{ matrix.arch }}
        if: env.BUILD_VARIANT == 'Debug'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: debug apk (${{ matrix.arch }})
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
